<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crypto Donation Tracker</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #080d0f;
      --panel: #0d1618;
      --border: #0e3038;
      --accent: #00ffd5;
      --accent2: #00b8a0;
      --dim: #1a2e33;
      --text: #c8e8e3;
      --muted: #4a7a75;
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 15px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,213,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,213,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,13,15,0.92);
      backdrop-filter: blur(6px);
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 18px;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    .logo span { color: var(--muted); }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
      display: inline-block;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50% { opacity:.4; transform:scale(1.4); }
    }

    .header-right {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto 1fr;
      gap: 0;
      height: calc(100vh - 57px);
    }

    .sidebar {
      grid-row: 1 / 3;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 0;
      overflow-y: auto;
      background: var(--panel);
    }

    .panel {
      border-bottom: 1px solid var(--border);
      padding: 20px;
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .counter-wrap {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    #counter {
      font-family: var(--font-mono);
      font-size: 48px;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0,255,213,0.4);
      line-height: 1;
      transition: all 0.3s;
    }
    .counter-label {
      font-size: 12px;
      color: var(--muted);
      font-family: var(--font-mono);
    }

    .wallet-card {
      background: var(--dim);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px;
    }

    .wallet-address {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent);
      word-break: break-all;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .wallet-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid var(--accent2);
      background: transparent;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
      text-transform: uppercase;
    }
    .btn:hover {
      background: rgba(0,255,213,0.08);
      border-color: var(--accent);
      box-shadow: 0 0 8px rgba(0,255,213,0.2);
    }
    .btn:active { transform: scale(0.97); }

    .qr-wrap {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }
    .qr-wrap img {
      border: 2px solid var(--border);
      border-radius: 4px;
      filter: invert(1) hue-rotate(140deg) saturate(2);
      width: 140px; height: 140px;
    }

    #feed {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .feed-item {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text);
      line-height: 1.6;
      animation: slideIn 0.4s ease;
    }
    .feed-item:first-child {
      border-top: 1px solid var(--accent2);
      background: rgba(0,255,213,0.04);
    }
    @keyframes slideIn {
      from { opacity:0; transform:translateX(-10px); }
      to   { opacity:1; transform:translateX(0); }
    }
    .feed-item strong { color: var(--accent); }

    #map {
      z-index: 1;
      background: #060d10;
    }

    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) saturate(0.5) brightness(0.7); }
    .leaflet-control-zoom a {
      background: var(--panel) !important;
      color: var(--accent) !important;
      border-color: var(--border) !important;
    }

    #toast {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--accent);
      color: #000;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 22px;
      border-radius: 3px;
      z-index: 9999;
      letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(0,255,213,0.5);
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--panel); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent2); }
  </style>
</head>
<body>

  <header>
    <div class="logo">CRYPTO<span>//</span>TRACK</div>
    <div class="header-right">
      <span class="status-dot"></span>LIVE · TRC20 · TRON NETWORK
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">// total received</div>
        <div class="counter-wrap">
          <div id="counter">$0</div>
          <div class="counter-label">USDT</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">// wallet · TRC20</div>
        <div class="wallet-card">
          <div class="wallet-address" id="walletText">—</div>
          <div class="wallet-actions">
            <button class="btn" onclick="copyWallet()">⧉ Copy</button>
            <button class="btn" onclick="openTronscan()">↗️ Scan</button>
          </div>
        </div>
        <div class="qr-wrap">
          <img id="qr" src="" alt="QR"/>
        </div>
      </div>
      <div class="panel" style="flex:1; border-bottom:none;">
        <div class="panel-title">// live feed</div>
        <div id="feed"></div>
      </div>
    </aside>
    <div id="map"></div>
  </div>

  <div id="toast"></div>

  <script>
    const wallet = "TX7cDUq71NwRNTi5QSev6ziJMqtMWF7GEj";

    document.getElementById("walletText").innerText = wallet || "Wallet not configured";

    const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(wallet);
    const qr = document.getElementById("qr");
    qr.src = qrUrl;

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.innerText = text;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 1800);
    }

    function copyWallet() {
      if (!wallet) { showToast("No wallet configured"); return; }
      navigator.clipboard.writeText(wallet)
        .then(() => showToast("✓ Wallet copied"))
        .catch(() => showToast("Copy failed"));
    }

    function openTronscan() {
      if (!wallet) { showToast("No wallet configured"); return; }
      window.open(https://tronscan.org/#/address/${wallet}, "_blank");
    }

    let total = 0;
    function updateCounter() {
      document.getElementById("counter").innerText = "$" + total;
    }

    const map = L.map("map").setView([20, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
    }).addTo(map);

    const feed = document.getElementById("feed");

    function addFeed(text) {
      const item = document.createElement("div");
      item.className = "feed-item";
      item.innerHTML = text;
      feed.prepend(item);
      if (feed.children.length > 8) feed.removeChild(feed.lastChild);
    }

    let seen = new Set();

    async function loadTX() {
      if (!wallet) return;
      try {
        const url = https://api.trongrid.io/v1/accounts/${wallet}/transactions/trc20?limit=20;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.data) return;

        data.data.forEach((tx) => {
          if (seen.has(tx.transaction_id)) return;
          seen.add(tx.transaction_id);

          const lat = Math.random() * 140 - 70;
          const lng = Math.random() * 360 - 180;

          L.circleMarker([lat, lng], {
            radius: 7,
            color: "#00ffd5",
            fillColor: "#00ffd5",
            fillOpacity: 0.9,
          })
            .addTo(map)
            .bindPopup(<b>New Transaction</b><br>TX: ${tx.transaction_id}<br>From: ${tx.from_address});

          addFeed(<strong>New donation detected</strong><br>TX: ${tx.transaction_id.slice(0, 18)}...);

          total += 1;
          updateCounter();
        });
      } catch (err) {
        console.log(err);
      }
    }

    loadTX();
    setInterval(loadTX, 12000);
  </script>
</body>
