<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Donation Tracker</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #05080a;
      --panel: #091115;
      --border: #11353d;
      --accent: #00ffd5;
      --accent2: #00b8a0;
      --text: #c8e8e3;
      --muted: #5a8c87;
      --shadow: rgba(0, 255, 213, 0.16);
      --font-mono: 'Share Tech Mono', monospace;
      --font-ui: 'Rajdhani', sans-serif;
    }

    body {
      background: radial-gradient(circle at top, rgba(0,255,213,0.08), transparent 25%),
                  linear-gradient(180deg, #070b0f 0%, #05080a 100%);
      color: var(--text);
      font-family: var(--font-ui);
      min-height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,213,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,213,0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 28px;
      border-bottom: 1px solid rgba(0,255,213,0.12);
      background: rgba(8, 14, 18, 0.92);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-family: var(--font-mono);
      letter-spacing: 4px;
      font-size: 18px;
      color: var(--accent);
      text-transform: uppercase;
    }
    .logo span { color: var(--muted); }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px rgba(0,255,213,0.6);
      animation: pulse 1.8s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.45; }
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 340px 1fr;
      height: calc(100vh - 76px);
      min-height: 640px;
    }

    .sidebar {
      background: rgba(9, 17, 21, 0.96);
      border-right: 1px solid rgba(0,255,213,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(16px);
    }

    .panel {
      padding: 22px;
      border-bottom: 1px solid rgba(0,255,213,0.08);
    }

    .panel-title {
      font-family: var(--font-mono);
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 11px;
      margin-bottom: 14px;
    }

    .counter-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }
    #counter {
      font-family: var(--font-mono);
      font-size: 52px;
      color: var(--accent);
      text-shadow: 0 0 18px rgba(0,255,213,0.24);
      line-height: 1;
    }
    .counter-label {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
    }

    .wallet-card {
      background: rgba(4, 13, 16, 0.98);
      border: 1px solid rgba(0,255,213,0.14);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 0 30px rgba(0,255,213,0.06);
    }

    .wallet-address {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      word-break: break-word;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .wallet-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      border: 1px solid rgba(0,255,213,0.22);
      background: rgba(0,255,213,0.06);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .btn:hover {
      background: rgba(0,255,213,0.14);
      box-shadow: 0 0 18px rgba(0,255,213,0.18);
      transform: translateY(-1px);
    }

    .qr-wrap {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }
    .qr-wrap img {
      width: 148px;
      height: 148px;
      border: 2px solid rgba(0,255,213,0.18);
      border-radius: 16px;
      background: #010608;
      box-shadow: inset 0 0 12px rgba(0,255,213,0.08);
    }

    #feed {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: calc(100vh - 460px);
      overflow-y: auto;
      padding-right: 4px;
    }

    .feed-item {
      background: rgba(0,255,213,0.04);
      border: 1px solid rgba(0,255,213,0.12);
      border-radius: 10px;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: var(--text);
      box-shadow: 0 0 14px rgba(0,255,213,0.06);
      word-break: break-word;
    }
    .feed-item strong { color: var(--accent); }

    #map {
      position: relative;
      background: #04090d;
      min-height: 100%;
    }
    #map .leaflet-container {
      height: 100%;
      width: 100%;
    }

    .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) saturate(0.5) brightness(0.75);
    }
    .leaflet-control-zoom a {
      background: rgba(9,17,21,0.95) !important;
      color: var(--accent) !important;
      border-color: rgba(0,255,213,0.14) !important;
    }

    #toast {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      background: var(--accent);
      color: #000;
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 12px 20px;
      border-radius: 999px;
      z-index: 999;
      box-shadow: 0 0 24px rgba(0,255,213,0.3);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.12);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0,255,213,0.2);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">CRYPTO<span>//</span>TRACK</div>
    <div class="status">
      <span class="status-dot"></span>
      <span>LIVE · TRC20 · TRON NETWORK</span>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-title">// total received</div>
        <div class="counter-wrap">
          <div id="counter">$0</div>
          <div class="counter-label">USDT</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">// wallet · TRC20</div>
        <div class="wallet-card">
          <div class="wallet-address" id="walletText">—</div>
          <div class="wallet-actions">
            <button class="btn" id="copyBtn">⧉ Copy</button>
            <button class="btn" id="scanBtn">↗️ Tronscan</button>
          </div>
        </div>
        <div class="qr-wrap">
          <img id="qr" src="" alt="QR-код кошелька" />
        </div>
      </div>

      <div class="panel" style="flex: 1; display: flex; flex-direction: column;">
        <div class="panel-title">// live feed</div>
        <div id="feed"></div>
      </div>
    </aside>

    <div id="map"></div>
  </div>

  <div id="toast"></div>

  <script>
    const wallet = "TX7cDUq71NwRNTi5QSev6ziJMqtMWF7GEj";
    const walletText = document.getElementById("walletText");
    const qr = document.getElementById("qr");
    const feed = document.getElementById("feed");
    const toast = document.getElementById("toast");
    const copyBtn = document.getElementById("copyBtn");
    const scanBtn = document.getElementById("scanBtn");
    let total = 0;
    let seen = new Set();

    walletText.textContent = wallet || "Wallet not configured";
    qr.src = "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" + encodeURIComponent(wallet);
    qr.alt = "QR-код TRC20 кошелька";

    function showToast(message) {
      toast.textContent = message;
      toast.style.display = "block";
      setTimeout(() => {
        toast.style.display = "none";
      }, 1800);
    }

    copyBtn.addEventListener("click", () => {
      if (!wallet) {
        showToast("Кошелёк не настроен");
        return;
      }
      navigator.clipboard.writeText(wallet)
        .then(() => showToast("Адрес скопирован"))
        .catch(() => showToast("Не удалось скопировать"));
    });

    scanBtn.addEventListener("click", () => {
      if (!wallet) {
        showToast("Кошелёк не настроен");
        return;
      }
      window.open(`https://tronscan.org/#/address/${wallet}`, "_blank");
    });

    function updateCounter() {
      document.getElementById("counter").innerText = "$" + total;
    }

    function addFeedItem(html) {
      const item = document.createElement("div");
      item.className = "feed-item";
      item.innerHTML = html;
      feed.prepend(item);
      while (feed.children.length > 8) {
        feed.removeChild(feed.lastChild);
      }
    }

    const map = L.map("map").setView([20, 0], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
    }).addTo(map);

    async function loadTX() {
      if (!wallet) return;
      try {
        const url = `https://api.trongrid.io/v1/accounts/${wallet}/transactions/trc20?limit=20`;
        const res = await fetch(url);
        const data = await res.json();
        if (!data.data || !Array.isArray(data.data)) return;

        data.data.forEach((tx) => {
          if (!tx.transaction_id || seen.has(tx.transaction_id)) return;
          seen.add(tx.transaction_id);

          const lat = Math.random() * 140 - 70;
          const lng = Math.random() * 360 - 180;

          L.circleMarker([lat, lng], {
            radius: 7,
            color: "#00ffd5",
            fillColor: "#00ffd5",
            fillOpacity: 0.9,
          })
            .addTo(map)
            .bindPopup(`
              <strong>Новая транзакция</strong><br />
              TX: ${tx.transaction_id}<br />
              From: ${tx.from_address || '—'}
            `);

          addFeedItem(`
            <strong>Новый донат</strong><br />
            TX: ${tx.transaction_id.slice(0, 18)}...<br />
            От: ${tx.from_address || 'неизвестно'}
          `);

          total += 1;
          updateCounter();
        });
      } catch (error) {
        console.error(error);
      }
    }

    loadTX();
    setInterval(loadTX, 12000);
  </script>
</body>
</html>
